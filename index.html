<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Grand Gribidouillage</title>
  <!--
    ⚠️ À faire côté projet Firebase :
      1) Renseigne le firebaseConfig ci-dessous.
      2) Activer Authentification → Connexion anonyme.
      3) Storage Rules : autoriser l'écriture pour users anonymes (ou ajuster).
      4) Database Rules : (on ajoutera les règles sécurisées avec users/users_by_name séparément).
  -->

  <style>
    :root {
      --bg: #1f1f1f;
      --panel: #2a2a2a;
      --text: #f0f0f0;
      --muted: #a5a5a5;
      --accent: #00d2ff;
      --danger: #ff4d4f;
      --grid: rgba(0,0,0,0.2);
      --border: #444;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden; /* Pas de scroll page, on gère le pan/zoom nous-mêmes */
      user-select: none;
    }

    /* ===== HUD top-center ===== */
    #hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      z-index: 20;
      backdrop-filter: blur(4px);
    }
    #hud .swatch {
      width: 16px; height: 16px; border-radius: 4px; border: 1px solid #000;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.2) inset;
      display: inline-block; vertical-align: middle;
    }

    /* ===== Viewport/stage ===== */
    #viewport {
      position: fixed;
      inset: 0; /* plein écran */
      overflow: hidden; /* interdit toute fuite hors écran */
      background: #ffffff; /* couleur de fond quand pas peint */
      z-index: 1;
      cursor: crosshair; /* remplacé dynamiquement par un curseur coloré */
    }
    /* Le stage contient nos canvases et subit les transforms */
    #stage {
      position: absolute; top: 0; left: 0;
      transform-origin: 0 0; /* important pour les maths */
      will-change: transform;
    }

    /* Deux canvases superposés pour séparer dessin et grille */
    canvas { display: block; image-rendering: pixelated; }
    #paintCanvas, #gridCanvas {
      position: absolute; top: 0; left: 0;
    }

    /* ===== Toolbar bottom-center ===== */
    #toolbar {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 30;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fill, 32px);
      grid-auto-rows: 32px;
      gap: 6px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: min(92vw, 640px); /* 2 lignes max recommandé */
    }
    .color {
      width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
      border: 2px solid #333; box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .color.selected { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }

    #zoomCol {
      display: flex; flex-direction: column; gap: 6px;
      width: 140px; align-items: stretch;
    }
    button.btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 10px;
      font-weight: 700; font-size: 14px;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease;
    }
    button.btn:hover { background: #343434; }
    button.btn:active { transform: translateY(1px); }

    .row { display: flex; gap: 8px; }
    .center { justify-content: center; }

    /* Indications en bas */
    #hints { font-size: 12px; color: var(--muted); text-align: center; }

    /* Mode Pan (Main) visuel */
    .pan-cursor { cursor: grab !important; }
    .panning .pan-cursor { cursor: grabbing !important; }

    /* Toast simple */
    #toast {
      position: fixed; right: 12px; bottom: 12px; z-index: 40;
      background: rgba(0,0,0,.7); color: #fff; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--border); display: none;
    }
  </style>
</head>
<body>
  <!-- ===== HUD (infos en haut) ===== -->
  <div id="hud">
    <span>Coords: <strong id="coords">0,0</strong></span>
    <span>Connectés: <strong id="connected">0</strong></span>
    <span>Clics: <strong id="clicks">0</strong></span>
    <span>Couleur: <span id="swatch" class="swatch" style="background:#000"></span></span>
  </div>

  <!-- ===== Viewport + Stage (canvases) ===== -->
  <div id="viewport">
    <div id="stage">
      <canvas id="paintCanvas"></canvas>
      <canvas id="gridCanvas"></canvas>
    </div>
  </div>

  <!-- ===== Toolbar ===== -->
  <div id="toolbar">
    <div id="palette" class="palette" aria-label="Palette de couleurs"></div>
    <div id="zoomCol">
      <button id="zoomIn" class="btn" aria-label="Zoom avant">Zoom +</button>
      <button id="zoomOut" class="btn" aria-label="Zoom arrière">Zoom −</button>
      <button id="toggleGrid" class="btn" aria-label="Afficher / cacher la grille">Grille ON/OFF</button>
      <button id="togglePan" class="btn" aria-label="Basculer en mode déplacement">Mode Main</button>
    </div>
    <div id="hints">Astuce : <strong>Shift + molette</strong> pour changer de couleur • <strong>Cliquer</strong> pour peindre</div>
  </div>

  <!-- Toast (feedback) -->
  <div id="toast"></div>

  <!-- ===== App Script (ESM) ===== -->
  <script type="module">
    /*********************************************************
     * 🔥 Firebase
     *********************************************************/
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, set, onValue, serverTimestamp, push, onDisconnect,
      onChildAdded, onChildChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getStorage, ref as sRef, uploadBytes } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

   const firebaseConfig = {

  apiKey: "AIzaSyBCy1NFYox9035-xdx52cale0gzLa5am4I",

  authDomain: "shoudinpixelwar.firebaseapp.com",

  databaseURL: "https://shoudinpixelwar-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "shoudinpixelwar",

  storageBucket: "shoudinpixelwar.firebasestorage.app",

  messagingSenderId: "896929635521",

  appId: "1:896929635521:web:357f7b8a29cb5045684840",

  measurementId: "G-FR7NC03RCY"

};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    // Auth anonyme (nécessaire pour Storage si règles l'exigent)
    signInAnonymously(auth).catch((e) => console.warn("Auth anonyme échouée:", e));

    /*********************************************************
     * ⚙️ Paramètres & éléments DOM
     *********************************************************/
    const GRID_W = 300, GRID_H = 300; // grille carrée
    const PIX = window.innerWidth < 768 ? 8 : 10; // mobile/desktop

    const viewport = document.getElementById('viewport');
    const stage = document.getElementById('stage');
    const paintCanvas = document.getElementById('paintCanvas');
    const gridCanvas = document.getElementById('gridCanvas');
    const pctx = paintCanvas.getContext('2d');
    const gctx = gridCanvas.getContext('2d');

    const coordsEl = document.getElementById('coords');
    const connEl = document.getElementById('connected');
    const clicksEl = document.getElementById('clicks');
    const swatchEl = document.getElementById('swatch');

    const paletteDiv = document.getElementById('palette');
    const toastEl = document.getElementById('toast');

    // Taille logique des canvases (non scalée) = grille * PIX
    const CANVAS_W = GRID_W * PIX;
    const CANVAS_H = GRID_H * PIX;
    paintCanvas.width = CANVAS_W; paintCanvas.height = CANVAS_H;
    gridCanvas.width = CANVAS_W; gridCanvas.height = CANVAS_H;

    // Stage dimension (s'aligne aux canvases)
    stage.style.width = CANVAS_W + 'px';
    stage.style.height = CANVAS_H + 'px';

    /*********************************************************
     * 🎨 Palette & curseur coloré
     *********************************************************/
    const BASE_PALETTE = [
      "#000000", "#FFFFFF", "#FF0000",
      "#FFDBAC", "#F1C27D", "#E0AC69", // 3 teintes peau
      "#FF9900", "#FFFF00", "#00FF00",
      "#00FFFF", "#0000FF", "#9900FF",
      "#FF00FF", "#808080", "#964B00"
    ];

    let palette = [...BASE_PALETTE];
    let colorIndex = 0;
    let currentColor = palette[colorIndex];

    function renderPalette() {
      paletteDiv.innerHTML = '';
      palette.forEach((c, i) => {
        const d = document.createElement('div');
        d.className = 'color' + (i === colorIndex ? ' selected' : '');
        d.style.background = c;
        d.title = c;
        d.addEventListener('click', () => setColorIndex(i));
        paletteDiv.appendChild(d);
      });
      swatchEl.style.background = currentColor;
      updateCursor(currentColor);
    }

    function setColorIndex(i) {
      colorIndex = (i + palette.length) % palette.length;
      currentColor = palette[colorIndex];
      renderPalette();
    }

    function updateCursor(color) {
      // Génère un petit curseur rond coloré en dataURL (16x16)
      const c = document.createElement('canvas'); c.width = 16; c.height = 16;
      const x = c.getContext('2d');
      x.clearRect(0,0,16,16);
      x.beginPath(); x.arc(8,8,6,0,Math.PI*2);
      x.fillStyle = color; x.fill();
      x.lineWidth = 2; x.strokeStyle = '#000'; x.stroke();
      const url = c.toDataURL('image/png');
      viewport.style.cursor = `url(${url}) 8 8, crosshair`;
    }

    renderPalette();

    // Shift + Molette → changer de couleur
    window.addEventListener('wheel', (e) => {
      if (e.shiftKey) {
        e.preventDefault();
        const dir = e.deltaY > 0 ? 1 : -1;
        setColorIndex(colorIndex + dir);
      }
    }, { passive: false });

    /*********************************************************
     * 🧭 Pan & Zoom (bornés)
     *********************************************************/
    let scale = 1;
    let offsetX = 0, offsetY = 0; // translation en px (appliquée au stage)

    function applyTransform() {
      stage.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }

    function clampOffsets() {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const sw = CANVAS_W * scale, sh = CANVAS_H * scale;
      // on empêche toute fuite : le stage ne peut jamais quitter l'écran
      const minX = Math.min(0, vw - sw), maxX = 0;
      const minY = Math.min(0, vh - sh), maxY = 0;
      if (offsetX < minX) offsetX = minX; if (offsetX > maxX) offsetX = maxX;
      if (offsetY < minY) offsetY = minY; if (offsetY > maxY) offsetY = maxY;
    }

    function zoomBy(factor, cx, cy) {
      // zoom autour d'un point écran (cx,cy) → conserve le point monde
      const before = screenToWorld(cx, cy);
      scale *= factor;
      // limites raisonnables
      if (scale < 0.2) scale = 0.2; if (scale > 40) scale = 40;
      const after = { x: before.x * scale, y: before.y * scale };
      offsetX = cx - after.x;
      offsetY = cy - after.y;
      clampOffsets();
      applyTransform();
    }

    function screenToWorld(sx, sy) {
      // coordonnées monde en pixels *réels* (pas cellules)
      const rect = viewport.getBoundingClientRect();
      const x = (sx - rect.left - offsetX) / scale;
      const y = (sy - rect.top - offsetY) / scale;
      return { x, y };
    }

    function worldToCell(wx, wy) {
      return {
        x: Math.floor(wx / PIX),
        y: Math.floor(wy / PIX),
      };
    }

    // Boutons Zoom
    document.getElementById('zoomIn').addEventListener('click', () => {
      const cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2;
      zoomBy(1.2, cx, cy);
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      const cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2;
      zoomBy(1/1.2, cx, cy);
    });

    // Mode Pan (Main)
    const togglePanBtn = document.getElementById('togglePan');
    let panMode = false;
    togglePanBtn.addEventListener('click', () => {
      panMode = !panMode;
      if (panMode) viewport.classList.add('pan-cursor'); else viewport.classList.remove('pan-cursor');
    });

    let panning = false; let panStartX = 0, panStartY = 0; let startOffsetX = 0, startOffsetY = 0;
    viewport.addEventListener('pointerdown', (e) => {
      if (!panMode) return;
      panning = true; document.body.classList.add('panning');
      panStartX = e.clientX; panStartY = e.clientY;
      startOffsetX = offsetX; startOffsetY = offsetY;
      e.preventDefault();
    });
    window.addEventListener('pointermove', (e) => {
      if (!panning) return;
      offsetX = startOffsetX + (e.clientX - panStartX);
      offsetY = startOffsetY + (e.clientY - panStartY);
      clampOffsets(); applyTransform();
    });
    window.addEventListener('pointerup', () => { panning = false; document.body.classList.remove('panning'); });

    /*********************************************************
     * 🧱 Grille (overlay) & Toggle
     *********************************************************/
    let showGrid = true;

    function drawGrid() {
      gctx.clearRect(0,0,gridCanvas.width, gridCanvas.height);
      if (!showGrid) return;
      gctx.save();
      gctx.strokeStyle = 'rgba(0,0,0,0.15)';
      gctx.lineWidth = 1;
      // lignes verticales
      for (let x = 0; x <= GRID_W; x++) {
        gctx.beginPath();
        gctx.moveTo(x * PIX + 0.5, 0);
        gctx.lineTo(x * PIX + 0.5, CANVAS_H);
        gctx.stroke();
      }
      // lignes horizontales
      for (let y = 0; y <= GRID_H; y++) {
        gctx.beginPath();
        gctx.moveTo(0, y * PIX + 0.5);
        gctx.lineTo(CANVAS_W, y * PIX + 0.5);
        gctx.stroke();
      }
      gctx.restore();
    }
    drawGrid();

    document.getElementById('toggleGrid').addEventListener('click', () => {
      showGrid = !showGrid; drawGrid();
    });

    /*********************************************************
     * ✍️ Dessin
     *********************************************************/
    let drawing = false;
    let clicks = 0;

    function drawCell(cx, cy, color) {
      if (cx < 0 || cy < 0 || cx >= GRID_W || cy >= GRID_H) return;
      pctx.fillStyle = color;
      pctx.fillRect(cx * PIX, cy * PIX, PIX, PIX);
    }

    viewport.addEventListener('pointermove', (e) => {
      const w = screenToWorld(e.clientX, e.clientY);
      const cell = worldToCell(w.x, w.y);
      coordsEl.textContent = `${cell.x},${cell.y}`;
    });

    viewport.addEventListener('pointerdown', (e) => {
      if (panMode) return; // pas de dessin en mode pan
      drawing = true;
      paintAt(e.clientX, e.clientY);
    });
    window.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      paintAt(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', () => { drawing = false; });

    function paintAt(sx, sy) {
      const w = screenToWorld(sx, sy);
      const cell = worldToCell(w.x, w.y);
      const { x, y } = cell;
      if (x < 0 || y < 0 || x >= GRID_W || y >= GRID_H) return;
      // Dessin local
      drawCell(x, y, currentColor);
      // Écriture DB
      set(ref(db, `pixels/${x}_${y}`), { c: currentColor, t: serverTimestamp() });
      // Clics
      clicks++; clicksEl.textContent = String(clicks);
    }

    /*********************************************************
     * 🔄 Synchro en temps réel (lecture)
     *********************************************************/
    const pixelsRef = ref(db, 'pixels');

    // Dessin incrémental des pixels reçus
    onChildAdded(pixelsRef, (snap) => {
      const k = snap.key; const v = snap.val(); if (!v) return;
      const [x, y] = k.split('_').map(Number); drawCell(x, y, v.c);
    });
    onChildChanged(pixelsRef, (snap) => {
      const k = snap.key; const v = snap.val(); if (!v) return;
      const [x, y] = k.split('_').map(Number); drawCell(x, y, v.c);
    });

    /*********************************************************
     * 👥 Presence (connectés)
     *********************************************************/
    const presenceRef = ref(db, 'presence');
    const meRef = push(presenceRef);
    onDisconnect(meRef).remove();
    set(meRef, { at: serverTimestamp(), ua: navigator.userAgent.slice(0,64) })
      .catch(()=>{});

    onValue(presenceRef, (snap) => {
      const val = snap.val() || {};
      const n = Object.keys(val).length;
      connEl.textContent = String(n);
    });

    /*********************************************************
     * 🗃️ Archivage PNG automatique (toutes les 60s)
     *********************************************************/
    const ARCHIVE_ACTIVE = true; // actif par défaut

    function pad(n){ return n.toString().padStart(2,'0'); }
    function tsName() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const MM = pad(d.getMonth()+1);
      const dd = pad(d.getDate());
      const hh = pad(d.getHours());
      const mm = pad(d.getMinutes());
      const ss = pad(d.getSeconds());
      return `${yyyy}${MM}${dd}_${hh}${mm}${ss}`;
    }

    async function archivePNG() {
      if (!ARCHIVE_ACTIVE) return;
      try {
        await new Promise((resolve) => paintCanvas.toBlob(resolve, 'image/png'))
          .then(async (blob) => {
            if (!blob) return;
            const name = `archives/${tsName()}.png`;
            const dest = sRef(storage, name);
            await uploadBytes(dest, blob);
            showToast('Archivage PNG OK → ' + name);
          });
      } catch (e) {
        console.warn('Archivage échoué:', e);
      }
    }

    setInterval(archivePNG, 60_000);

    /*********************************************************
     * ♻️ Reset auto 48h (PAUSE)
     *********************************************************/
    const RESET_ACTIVE = false; // Laisser à false tant que la feature est en pause
    const RESET_EVERY_HOURS = 48;
    const lastResetRef = ref(db, 'meta/lastReset');

    async function maybeReset() {
      if (!RESET_ACTIVE) return;
      onValue(lastResetRef, async (snap) => {
        const last = snap.val();
        const now = Date.now();
        if (!last || now - last > RESET_EVERY_HOURS * 3600_000) {
          // ⚠️ Réinitialisation : côté client on ne purge pas la DB entière.
          // On préfère déléguer un Cloud Function/Admin Script, ou écrire un flag.
          // Ici, on se contente d'effacer le canvas local pour l'exemple.
          pctx.clearRect(0,0,CANVAS_W, CANVAS_H);
          // TODO: implémenter une vraie purge côté serveur (sécurité/règles nécessaires).
          set(lastResetRef, Date.now());
          showToast('Reset logic PAUSE — placeholder exécuté côté client.');
        }
      }, { onlyOnce: true });
    }

    maybeReset();

    /*********************************************************
     * 🧰 Utilitaires UI
     *********************************************************/
    function showToast(msg, ms=2500) {
      toastEl.textContent = msg; toastEl.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=>{ toastEl.style.display = 'none'; }, ms);
    }

    // HUD couleur active = synchro
    function updateHUDColor() { swatchEl.style.background = currentColor; }

    /*********************************************************
     * ⌨️ Accessibilité / Raccourcis
     *********************************************************/
    // [G] = toggle grille, [M] = mode Main (pan)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'g' || e.key === 'G') { showGrid = !showGrid; drawGrid(); }
      if (e.key === 'm' || e.key === 'M') { togglePanBtn.click(); }
      if ((e.key === '+' || e.key === '=') && !e.shiftKey) {
        const cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2; zoomBy(1.2, cx, cy);
      }
      if (e.key === '-') {
        const cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2; zoomBy(1/1.2, cx, cy);
      }
      if (e.key === '[') setColorIndex(colorIndex - 1);
      if (e.key === ']') setColorIndex(colorIndex + 1);
    });

    // Synchroniser HUD couleur lors des changements
    const _origSetColor = setColorIndex;
    setColorIndex = function(i){ _origSetColor(i); updateHUDColor(); };

    // Démarrage : centrer stage si plus petit que viewport
    function centerIfSmaller() {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const sw = CANVAS_W * scale, sh = CANVAS_H * scale;
      if (sw < vw) offsetX = Math.floor((vw - sw)/2);
      if (sh < vh) offsetY = Math.floor((vh - sh)/2);
      applyTransform();
    }

    centerIfSmaller();
    window.addEventListener('resize', () => { clampOffsets(); applyTransform(); });

  </script>
</body>
</html>
