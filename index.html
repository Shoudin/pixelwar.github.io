<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel War — Illimité + Reset 48h + Archive 1 min + Compteur + Palette flottante + Grille + Coordonnées</title>
  <style>
    :root { --sidebar-w: 92px; }
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .ui { display:flex; gap:16px; align-items:center; margin-bottom:12px; flex-wrap: wrap; }
    .dim { opacity:.7 }
    #stageArea { margin-left: calc(var(--sidebar-w) + 16px); }
    #stageWrap { display:inline-block; transform-origin: top left; }
    #board { image-rendering: pixelated; border:1px solid #333; touch-action: manipulation; display:block; }

    /* Palette flottante verticale */
    #paletteDock {
      position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
      width: var(--sidebar-w); max-height: 80vh; padding: 10px 8px;
      border: 1px solid #333; border-radius: 12px; background: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      display: flex; flex-direction: column; gap: 8px; overflow: auto; z-index: 10;
    }
    #paletteDock h3 { margin: 0 0 6px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color:#444; }
    .sw { width: 28px; height: 28px; border:1px solid #000; border-radius: 6px; cursor:pointer; }
    .swRow { display:flex; gap:6px; flex-wrap: wrap; }
    .activeSw { outline: 2px solid #000; outline-offset: 2px; }

    .zoomControls { display:flex; gap:8px; align-items:center; }
    .zoomControls button { cursor:pointer; padding:6px 10px; border:1px solid #aaa; border-radius:8px; background:#fff; }
    .zoomControls .level { min-width: 48px; text-align:center; font-variant-numeric: tabular-nums; }

    .toggle { display:flex; gap:6px; align-items:center; }
    @media (max-width: 640px) {
      :root { --sidebar-w: 76px; }
      .sw { width:24px; height:24px; }
    }
  </style>
</head>
<body>
  <h1>Pixel War — Illimité</h1>
  <div class="ui">
    <div>Prochain reset : <span id="countdown" class="dim">chargement…</span></div>
    <div>Connectés : <span id="onlineCount" class="dim">0</span></div>
    <div>Pixels posés : <span id="clickCount" class="dim">0</span></div>
    <div>Coordonnées : <span id="coords" class="dim">—</span></div>
    <div class="zoomControls">
      <button id="zOut" title="Zoom -">−</button>
      <div class="level" id="zLevel">100%</div>
      <button id="zIn" title="Zoom +">+</button>
      <button id="zReset" title="Réinitialiser le zoom">Reset</button>
    </div>
    <label class="toggle" title="Afficher/masquer la grille">
      <input type="checkbox" id="showGridChk">
      Grille
    </label>
  </div>

  <!-- Palette flottante -->
  <aside id="paletteDock" aria-label="Palette de couleurs">
    <h3>Palette</h3>
    <div class="swRow" id="palette"></div>
  </aside>

  <!-- Zone de scène zoomable -->
  <div id="stageArea">
    <div id="stageWrap">
      <canvas id="board" width="1000" height="1000"></canvas>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script>
  // === Config Firebase (remplace PASTE_ME) ===
 const firebaseConfig = {

  apiKey: "AIzaSyBCy1NFYox9035-xdx52cale0gzLa5am4I",

  authDomain: "shoudinpixelwar.firebaseapp.com",

  databaseURL: "https://shoudinpixelwar-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "shoudinpixelwar",

  storageBucket: "shoudinpixelwar.firebasestorage.app",

  messagingSenderId: "896929635521",

  appId: "1:896929635521:web:357f7b8a29cb5045684840",

  measurementId: "G-FR7NC03RCY"

};

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const storage = firebase.storage();

  // === Paramètres mosaïque & palette ===
  const W = 100, H = 100, PIX = 10;
  const colors = [
   '#000000', // noir
    '#FFFFFF', // blanc
   
    '#E91E63','#9C27B0','#3F51B5',
    '#03A9F4','#009688','#8BC34A','#FFEB3B','#FF9800',
    '#AD1457','#6A1B9A','#283593','#0288D1','#00695C',
    '#558B2F','#FBC02D','#EF6C00','#D84315','#795548',
     '#E0E0E0', // gris clair
    '#9E9E9E', // gris moyen
    '#616161', // gris foncé

  ];
  let selected = 2;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const paletteEl = document.getElementById('palette');
  const countdownEl = document.getElementById('countdown');
  const onlineEl = document.getElementById('onlineCount');
  const clickEl = document.getElementById('clickCount');
  const coordsEl = document.getElementById('coords');
  const stageWrap = document.getElementById('stageWrap');
  const zLevelEl = document.getElementById('zLevel');
  const showGridChk = document.getElementById('showGridChk');

  // === Dessin & grille ===
  let grid = Array.from({length:H}, ()=>Array.from({length:W}, ()=>1));
  function drawCell(x,y){ ctx.fillStyle = colors[grid[y][x]]; ctx.fillRect(x*PIX, y*PIX, PIX, PIX); }
  function fullPixels(){ for (let y=0;y<H;y++) for (let x=0;x<W;x++) drawCell(x,y); }

  function drawGridOverlay() {
    const thin = 'rgba(0,0,0,0.15)';
    const bold = 'rgba(0,0,0,0.35)';
    ctx.save();
    ctx.lineWidth = 1;

    // Verticales
    ctx.beginPath(); ctx.strokeStyle = thin;
    for (let x=0; x<=W; x++){
      const xx = x*PIX + 0.5;
      if (x % 10 === 0) {
        ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = bold;
        ctx.moveTo(xx, 0); ctx.lineTo(xx, H*PIX); ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = thin;
      } else { ctx.moveTo(xx, 0); ctx.lineTo(xx, H*PIX); }
    }
    ctx.stroke();

    // Horizontales
    ctx.beginPath(); ctx.strokeStyle = thin;
    for (let y=0; y<=H; y++){
      const yy = y*PIX + 0.5;
      if (y % 10 === 0) {
        ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = bold;
        ctx.moveTo(0, yy); ctx.lineTo(W*PIX, yy); ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = thin;
      } else { ctx.moveTo(0, yy); ctx.lineTo(W*PIX, yy); }
    }
    ctx.stroke();
    ctx.restore();
  }
  function redrawAll() {
    fullPixels();
    if (showGridChk.checked) drawGridOverlay();
  }
  redrawAll();

  // === Curseur coloré dynamique (SVG data URL) ===
  function makeColorCursor(hex, size = 22) {
    const r = Math.floor(size/2) - 2;
    const svg =
      `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'>` +
        `<circle cx='${size/2}' cy='${size/2}' r='${r}' fill='${hex}'/>` +
        `<circle cx='${size/2}' cy='${size/2}' r='${r-0.5}' fill='none' stroke='white' stroke-width='2'/>` +
        `<circle cx='${size/2}' cy='${size/2}' r='${r-2.5}' fill='none' stroke='black' stroke-width='1.5'/>` +
      `</svg>`;
    return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}") ${Math.floor(size/2)} ${Math.floor(size/2)}, crosshair`;
  }

  // === Palette UI + curseur initial ===
  function renderPalette() {
    paletteEl.innerHTML = '';
    colors.forEach((c,i)=>{
      const sw = document.createElement('div');
      sw.className = 'sw'; sw.style.background = c; sw.title = c;
      if (i === selected) sw.classList.add('activeSw');
      sw.onclick = ()=>{
        selected = i;
        updateActiveSw();
        canvas.style.cursor = makeColorCursor(colors[selected]);
      };
      paletteEl.appendChild(sw);
    });
  }
  function updateActiveSw() {
    [...paletteEl.children].forEach((el, idx)=> el.classList.toggle('activeSw', idx === selected));
  }
  renderPalette();
  canvas.style.cursor = makeColorCursor(colors[selected]);
  canvas.addEventListener('mouseenter', ()=>{ canvas.style.cursor = makeColorCursor(colors[selected]); });
  canvas.addEventListener('mouseleave', ()=>{ canvas.style.cursor = 'default'; coordsEl.textContent = '—'; });

  // === Shift + molette = changer de couleur ===
  canvas.addEventListener('wheel', e => {
    if (e.shiftKey) {
      e.preventDefault();
      if (e.deltaY > 0) selected = (selected + 1) % colors.length;
      else if (e.deltaY < 0) selected = (selected - 1 + colors.length) % colors.length;
      updateActiveSw();
      canvas.style.cursor = makeColorCursor(colors[selected]);
    }
  }, { passive: false });

  // === Zoom (la palette ne zoome pas) ===
  let zoom = 1;
  function applyZoom(){ stageWrap.style.transform = `scale(${zoom})`; zLevelEl.textContent = `${Math.round(zoom*100)}%`; }
  document.getElementById('zIn').onclick   = ()=>{ zoom = Math.min(4, zoom * 1.25); applyZoom(); };
  document.getElementById('zOut').onclick  = ()=>{ zoom = Math.max(0.25, zoom / 1.25); applyZoom(); };
  document.getElementById('zReset').onclick= ()=>{ zoom = 1; applyZoom(); };
  applyZoom();

  // === Coordonnées en direct (x,y) — tient compte du zoom ===
  function screenToGrid(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const localX = (clientX - rect.left) / zoom;
    const localY = (clientY - rect.top)  / zoom;
    const x = Math.floor(localX / PIX);
    const y = Math.floor(localY / PIX);
    return { x, y };
  }
  canvas.addEventListener('mousemove', (e)=>{
    const {x,y} = screenToGrid(e.clientX, e.clientY);
    if (x>=0 && x<W && y>=0 && y<H) {
      coordsEl.textContent = `(${x}, ${y})`;
      coordsEl.classList.remove('dim');
    } else {
      coordsEl.textContent = '—';
    }
  });

  // === Storage helpers (PNG) ===
  function formatParisFilename(prefix="snapshot", ext="png") {
    const fmt = new Intl.DateTimeFormat('fr-FR',{ timeZone:'Europe/Paris', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const parts = fmt.formatToParts(new Date());
    const get=t=>parts.find(p=>p.type===t)?.value||'';
    const stamp = `${get('year')}-${get('month')}-${get('day')}_${get('hour')}-${get('minute')}-${get('second')}`;
    return `${prefix}_${stamp}.${ext}`;
  }
  function canvasToBlobPNG(cnv){ return new Promise(res => cnv.toBlob(b => res(b), 'image/png')); }
  async function uploadSnapshot(folder, filename) {
    await new Promise(r => requestAnimationFrame(r));
    const blob = await canvasToBlobPNG(canvas);
    const path = `${folder}/${filename}`;
    const ref = storage.ref().child(path);
    await ref.put(blob, { contentType: 'image/png' });
    const url = await ref.getDownloadURL();
    console.log('Snapshot uploadé →', path, url);
    return { path, url };
  }

  // === Reset & archive coordination ===
  const PERIOD_RESET=48*60*60*1000, PERIOD_ARCHIVE=60*1000;
  const nextResetRef=db.ref('config/nextResetAt'), lastResetRef=db.ref('config/lastResetAt');
  const nextArchRef=db.ref('config/nextArchiveAt'), lastArchRef=db.ref('config/lastArchiveAt');
  function updateCountdown(ts){
    if (!ts) { countdownEl.textContent = '—'; return; }
    const left = ts - Date.now();
    if (left <= 0) { countdownEl.textContent = 'reset imminent…'; return; }
    const h = Math.floor(left/3_600_000), m = Math.floor((left%3_600_000)/60_000), s = Math.floor((left%60_000)/1000);
    countdownEl.textContent = `${h}h ${m}m ${s}s`;
  }
  nextResetRef.on('value', s => updateCountdown(s.val()));

  async function tryReset(){
    const now=Date.now(); let commit=false, newNext=null;
    const res = await nextResetRef.transaction(cur => {
      if (cur===null){ newNext=now+PERIOD_RESET; commit=true; return newNext; }
      if (now>=cur){ newNext=now+PERIOD_RESET; commit=true; return newNext; }
      return;
    });
    if (res.committed && commit) {
      try { redrawAll(); await uploadSnapshot('resets', formatParisFilename('reset','png')); }
      catch(e){ console.warn('Snapshot reset échoué:', e); }
      await db.ref('pixels').remove();
      await lastResetRef.set(now);
      grid = Array.from({length:H}, ()=>Array.from({length:W}, ()=>1));
      redrawAll();
    }
  }
  async function tryArchive(){
    const now=Date.now(); let commit=false, newNext=null;
    const res = await nextArchRef.transaction(cur => {
      if (cur===null){ newNext=now+PERIOD_ARCHIVE; commit=true; return newNext; }
      if (now>=cur){ newNext=now+PERIOD_ARCHIVE; commit=true; return newNext; }
      return;
    });
    if (res.committed && commit) {
      try { redrawAll(); await uploadSnapshot('archive', formatParisFilename('archive','png')); await lastArchRef.set(now); }
      catch(e){ console.warn('Archive échouée:', e); }
    }
  }

  // === Présence + compteur clics ===
  const infoConnectedRef = db.ref('.info/connected');
  const presenceRootRef  = db.ref('presence');
  const clicksRef        = db.ref('stats/clicksTotal');

  // === Préférence d’affichage de la grille ===
  const gridPrefKey = 'pw-show-grid';
  showGridChk.checked = localStorage.getItem(gridPrefKey) === '1';
  showGridChk.addEventListener('change', ()=>{
    localStorage.setItem(gridPrefKey, showGridChk.checked ? '1' : '0');
    redrawAll();
  });

  // === Auth + live ===
  auth.signInAnonymously().catch(console.error);
  auth.onAuthStateChanged(user => {
    if (!user) return;
    const uid = user.uid;

    // Présence
    const myPresenceRef = presenceRootRef.child(uid);
    infoConnectedRef.on('value', snap => {
      if (snap.val() === true) {
        myPresenceRef.onDisconnect().remove().catch(()=>{});
        myPresenceRef.set({ online: true, ts: firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
      }
    });
    presenceRootRef.on('value', s => {
      const val = s.val() || {};
      onlineEl.textContent = String(Object.keys(val).length);
      onlineEl.classList.remove('dim');
    });

    // Compteur clics
    clicksRef.on('value', s => {
      clickEl.textContent = String(s.val() || 0);
      clickEl.classList.remove('dim');
    });

    // Pixels live
    const pixelsRef = db.ref('pixels');
    pixelsRef.once('value').then(snap => {
      const val = snap.val() || {};
      for (const key in val) {
        const [x,y] = key.split('_').map(Number);
        grid[y][x] = Number.isFinite(+val[key].color) ? +val[key].color : 1;
      }
      redrawAll();
    });
    pixelsRef.on('child_added', snap => {
      const [x,y] = snap.key.split('_').map(Number);
      grid[y][x] = Number.isFinite(+snap.val().color) ? +snap.val().color : 1;
      drawCell(x,y);
      if (showGridChk.checked) drawGridOverlay();
    });
    pixelsRef.on('child_changed', snap => {
      const [x,y] = snap.key.split('_').map(Number);
      grid[y][x] = Number.isFinite(+snap.val().color) ? +snap.val().color : 1;
      drawCell(x,y);
      if (showGridChk.checked) drawGridOverlay();
    });

    // Pose de pixel (corrigée pour le zoom) + incrément compteur
    canvas.addEventListener('click', async (e)=>{
      const {x,y} = screenToGrid(e.clientX, e.clientY);
      if (x<0||x>=W||y<0||y>=H) return;
      if (selected < 0 || selected >= colors.length) return;
      try {
        await db.ref(`pixels/${x}_${y}`).set({ color: selected });
        await clicksRef.transaction(cur => (cur||0) + 1);
      } catch (err) { console.error('write pixel / click count error', err); }
    });

    // Tickers
    tryReset();
    setInterval(tryReset,   60*1000);
    setInterval(tryArchive, 10*1000);
    setInterval(async ()=>{
      const snap = await nextResetRef.get();
      updateCountdown(snap.val());
    }, 1000);
  });
  </script>
</body>
</html>
