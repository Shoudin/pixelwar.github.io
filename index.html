<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <!-- On désactive le zoom natif ; le pinch est géré par l’app -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pixel War — 300×300 (fix OnePlus: safe-area + boutons palette)</title>
  <style>
    :root{
      --bar-h: 92px;
      --bar-pad: 10px;
      --gap: 8px;
      --sw: 28px;
      --cols: 14;
      /* Safe area (Android/iOS) */
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    /* Utiliser la vraie hauteur visuelle (corrige la “barre blanche” sur Android/OnePlus) */
    html, body {
      height: 100dvh;          /* nouvelle unité : hauteur viewport visuelle */
      min-height: 100dvh;
      /* fallbacks */
      height: -webkit-fill-available;
      overflow: hidden;
      background:#fff;
    }
    body {
      font-family: system-ui, sans-serif;
      margin: 16px;
      padding-bottom: var(--safe-bottom); /* évite recouvrement par zone gestuelle */
    }
    h1 { margin: 0 0 8px 0; font-size: 18px; }
    .ui { display:flex; gap:16px; align-items:center; margin-bottom:12px; flex-wrap: wrap; }
    .dim { opacity:.7 }

    /* Viewport scrollable encadré entre le header et la palette */
    #viewport{
      position: fixed;
      left: 0; right: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;  /* mis à none pendant pinch */
      background: #fff;
      z-index: 1;
    }

    /* Espace interne : un "sizer" définit la vraie zone scrollable après zoom */
    #space{ position: relative; }
    #sizer{ width: 1px; height: 1px; } /* dimensions ajustées par JS */

    /* La scène (absolue en 0,0 au-dessus du sizer) */
    #stageWrap{
      position: absolute; top: 0; left: 0;
      display:inline-block;
      transform-origin: top left;
      transition: transform 120ms ease-out; /* fluidité du zoom */
    }
    #board { image-rendering: pixelated; border:1px solid #333; touch-action: manipulation; display:block; }

    /* Palette bas (2 lignes) + boutons +/− empilés (ou dessous en mobile étroit) */
    #paletteBar{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      /* tenir compte de la safe area pour éviter une “bande blanche” */
      bottom: calc(8px + var(--safe-bottom));
      max-width: min(100vw - 16px, 1100px);
      padding: var(--bar-pad);
      border: 1px solid #333; border-radius: 14px; background: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
      display: grid;
      grid-template-columns: 1fr auto; /* grille couleurs | dock boutons */
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    #paletteGrid{
      display: grid;
      grid-auto-flow: row dense;
      grid-template-columns: repeat(var(--cols), var(--sw));
      grid-auto-rows: var(--sw);
      row-gap: var(--gap);
      column-gap: var(--gap);
      place-items: center;
    }
    .sw{
      width: var(--sw);
      height: var(--sw);
      border: 1px solid #000;
      border-radius: 6px;
      cursor: pointer;
    }
    .activeSw{ outline: 2px solid #000; outline-offset: 2px; }

    .dockZoom{
      display:flex; flex-direction: column; gap:6px;
      align-items:center; justify-content:center;
    }
    .dockZoom button{
      width: 36px; height: 28px;
      border:1px solid #aaa; border-radius:8px; background:#fff; cursor:pointer;
      font-size: 16px; line-height: 1;
    }

    .zoomControls{ display:flex; gap:8px; align-items:center; }
    .zoomControls button{ cursor:pointer; padding:6px 10px; border:1px solid #aaa; border-radius:8px; background:#fff; }
    .zoomControls .level{ min-width:48px; text-align:center; font-variant-numeric: tabular-nums; }
    .toggle{ display:flex; gap:6px; align-items:center; }
    #panToggle.active { background:#000; color:#fff; }

    /* ✅ Sur écrans très étroits (ex: OnePlus UI/zoom), on met les boutons sous la palette pour qu’ils restent visibles */
    @media (max-width: 420px){
      #paletteBar{ grid-template-columns: 1fr; }
      .dockZoom{ flex-direction: row; }
    }

    @media (max-width: 480px){
      :root{ --gap: 6px; }
      body{ margin: 12px; }
      .dockZoom button{ width: 32px; height: 26px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <h1>Pixel War — 300×300</h1>
  <div class="ui" id="uiBar">
    <div>Prochain reset : <span id="countdown" class="dim">Pause</span></div>
    <div>Connectés : <span id="onlineCount" class="dim">0</span></div>
    <div>Pixels posés : <span id="clickCount" class="dim">0</span></div>
    <div>Coordonnées : <span id="coords" class="dim">—</span></div>
    <div class="zoomControls">
      <button id="zOut"  title="Zoom -">−</button>
      <div class="level" id="zLevel">100%</div>
      <button id="zIn"   title="Zoom +">+</button>
      <button id="zReset" title="Réinitialiser le zoom">Reset</button>
      <button id="panToggle" title="Activer/Désactiver la main">Main</button>
    </div>
    <label class="toggle" title="Afficher/masquer la grille">
      <input type="checkbox" id="showGridChk"> Grille
    </label>
  </div>

  <!-- Viewport scrollable borné -->
  <div id="viewport">
    <div id="space">
      <div id="sizer"></div>
      <div id="stageWrap">
        <canvas id="board"></canvas>
      </div>
    </div>
  </div>

  <!-- Palette bas : grille 2 lignes + boutons (toujours visibles) -->
  <aside id="paletteBar" aria-label="Palette de couleurs">
    <div id="paletteGrid" aria-label="Couleurs"></div>
    <div class="dockZoom">
      <button id="dockZIn"  title="Zoom +">+</button>
      <button id="dockZOut" title="Zoom -">−</button>
    </div>
  </aside>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script>
  // === Config Firebase (remplace PASTE_ME) ===
  const firebaseConfig = {

  apiKey: "AIzaSyBCy1NFYox9035-xdx52cale0gzLa5am4I",

  authDomain: "shoudinpixelwar.firebaseapp.com",

  databaseURL: "https://shoudinpixelwar-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "shoudinpixelwar",

  storageBucket: "shoudinpixelwar.firebasestorage.app",

  messagingSenderId: "896929635521",

  appId: "1:896929635521:web:357f7b8a29cb5045684840",

  measurementId: "G-FR7NC03RCY"

};

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.database();
  const storage = firebase.storage();

  // === Paramètres mosaïque ===
  const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const W = 300, H = 300;
  let PIX = IS_MOBILE ? 8 : 10; // plus léger sur mobile
  const canvas = document.getElementById('board');
  canvas.width  = W * PIX;
  canvas.height = H * PIX;
  const ctx = canvas.getContext('2d');

  // === Palette (ordre + rouge + 3 peaux) ===
  const colors = [
    '#000000','#FFFFFF','#E91E63','#9C27B0','#3F51B5',
    '#03A9F4','#009688','#8BC34A','#FFEB3B','#FF9800',
    '#AD1457','#6A1B9A','#283593','#0288D1','#00695C',
    '#558B2F','#FBC02D','#EF6C00','#D84315','#795548',
    '#E0E0E0','#9E9E9E','#616161',
    '#FF0000', '#FFDBAC', '#F1C27D', '#E0AC69'
  ];
  let selected = 0;

  // === Références DOM ===
  const viewport   = document.getElementById('viewport');
  const space      = document.getElementById('space');
  const sizer      = document.getElementById('sizer');
  const stageWrap  = document.getElementById('stageWrap');
  const paletteGrid= document.getElementById('paletteGrid');
  const paletteBar = document.getElementById('paletteBar');
  const uiBar      = document.getElementById('uiBar');
  const countdownEl= document.getElementById('countdown');
  const onlineEl   = document.getElementById('onlineCount');
  const clickEl    = document.getElementById('clickCount');
  const coordsEl   = document.getElementById('coords');
  const zLevelEl   = document.getElementById('zLevel');
  const showGridChk= document.getElementById('showGridChk');
  const panToggle  = document.getElementById('panToggle');

  // ——— Helpers safe-area / visual viewport ———
  function cssNumber(varName, el = document.documentElement){
    const v = getComputedStyle(el).getPropertyValue(varName);
    return parseFloat(v) || 0;
  }
  function getSafeBottom(){ return cssNumber('--safe-bottom'); }

  // === Layout : viewport borné entre le header et la palette ===
  function layoutViewport(){
    const uiRect  = uiBar.getBoundingClientRect();
    const palRect = paletteBar.getBoundingClientRect();

    // Utiliser la *visual viewport* si dispo (Chrome Android) pour éviter le “trou blanc”
    const vv = window.visualViewport;
    const screenH = vv ? vv.height : window.innerHeight;

    // Espace entre le bas du viewport visuel et le haut de la palette
    const bottomSpace = Math.round((screenH - palRect.top) + 8 + getSafeBottom());
    viewport.style.top    = Math.round(uiRect.bottom + 8) + 'px';
    viewport.style.bottom = bottomSpace + 'px';
  }

  // === Grille mémoire + dessin ===
  let grid = Array.from({length:H}, ()=>Array.from({length:W}, ()=>1)); // 1 = blanc
  function drawCell(x,y){ ctx.fillStyle = colors[grid[y][x]]; ctx.fillRect(x*PIX, y*PIX, PIX, PIX); }
  function fullPixels(){ for (let y=0;y<H;y++) for (let x=0;x<W;x++) drawCell(x,y); }

  // Grille overlay
  function drawGridOverlay() {
    const thin = 'rgba(0,0,0,0.15)';
    const bold = 'rgba(0,0,0,0.35)';
    ctx.save(); ctx.lineWidth = 1;

    ctx.beginPath(); ctx.strokeStyle = thin;
    for (let x=0; x<=W; x++){
      const xx = x*PIX + 0.5;
      if (x % 10 === 0) {
        ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = bold;
        ctx.moveTo(xx, 0); ctx.lineTo(xx, H*PIX); ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = thin;
      } else { ctx.moveTo(xx, 0); ctx.lineTo(xx, H*PIX); }
    }
    ctx.stroke();

    ctx.beginPath(); ctx.strokeStyle = thin;
    for (let y=0; y<=H; y++){
      const yy = y*PIX + 0.5;
      if (y % 10 === 0) {
        ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = bold;
        ctx.moveTo(0, yy); ctx.lineTo(W*PIX, yy); ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = thin;
      } else { ctx.moveTo(0, yy); ctx.lineTo(W*PIX, yy); }
    }
    ctx.stroke();
    ctx.restore();
  }

  // Rendu initial
  fullPixels();
  if (localStorage.getItem('pw-show-grid') === '1') {
    showGridChk.checked = true; drawGridOverlay();
  } else { showGridChk.checked = false; }
  showGridChk.addEventListener('change', ()=>{
    localStorage.setItem('pw-show-grid', showGridChk.checked ? '1' : '0');
    fullPixels(); if (showGridChk.checked) drawGridOverlay();
  });

  // Curseur coloré
  function makeColorCursor(hex, size = 22) {
    const r = Math.floor(size/2) - 2;
    const svg =
      `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'>` +
        `<circle cx='${size/2}' cy='${size/2}' r='${r}' fill='${hex}'/>` +
        `<circle cx='${size/2}' cy='${size/2}' r='${r-0.5}' fill='none' stroke='white' stroke-width='2'/>` +
        `<circle cx='${size/2}' cy='${size/2}' r='${r-2.5}' fill='none' stroke='black' stroke-width='1.5'/>` +
      `</svg>`;
    return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}") ${Math.floor(size/2)} ${Math.floor(size/2)}, crosshair`;
  }
  function updateCursor(){ canvas.style.cursor = makeColorCursor(colors[selected]); }
  canvas.addEventListener('mouseenter', updateCursor);
  canvas.addEventListener('mouseleave', ()=>{ canvas.style.cursor = 'default'; coordsEl.textContent = '—'; });

  // Palette 2 lignes
  function buildPalette(){
    paletteGrid.innerHTML = '';
    colors.forEach((c,i)=>{
      const sw = document.createElement('div');
      sw.className = 'sw'; sw.style.background = c; sw.title = c;
      if (i===selected) sw.classList.add('activeSw');
      sw.onclick = ()=>{
        selected = i;
        [...paletteGrid.children].forEach(el => el.classList.remove('activeSw'));
        sw.classList.add('activeSw');
        updateCursor();
      };
      paletteGrid.appendChild(sw);
    });
  }

  function layoutPaletteTwoRows(){
    const total = colors.length;                // 30
    const cols  = Math.ceil(total / 2);         // 15
    const bar   = paletteBar;
    const btns  = bar.querySelector('.dockZoom');
    const barRect = bar.getBoundingClientRect();
    const btnRect = btns.getBoundingClientRect();
    const pad = 2*parseFloat(getComputedStyle(bar).paddingLeft);
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 8;

    const available = Math.max(120, barRect.width - btnRect.width - 10 - pad);
    const sw = Math.floor((available - gap*(cols-1)) / cols);

    const minSw = 18;
    const maxSw = IS_MOBILE ? 28 : 32;
    const clamped = Math.max(minSw, Math.min(maxSw, sw));

    bar.style.setProperty('--cols', cols);
    bar.style.setProperty('--sw', clamped + 'px');

    const barPad = parseFloat(getComputedStyle(bar).paddingTop) + parseFloat(getComputedStyle(bar).paddingBottom);
    const barH = (clamped*2) + gap + barPad; // 2 lignes + 1 gap
    document.documentElement.style.setProperty('--bar-h', Math.ceil(barH) + 'px');
  }

  // ===== Scroll borné : taille réelle du contenu = (W*PIX*zoom) =====
  function updateSizer(){
    const scaledW = W * PIX * zoom;
    const scaledH = H * PIX * zoom;
    sizer.style.width  = Math.ceil(scaledW) + 'px';
    sizer.style.height = Math.ceil(scaledH) + 'px';
  }
  function clampScroll(){
    const maxLeft = Math.max(0, sizer.offsetWidth  - viewport.clientWidth );
    const maxTop  = Math.max(0, sizer.offsetHeight - viewport.clientHeight);
    if (viewport.scrollLeft < 0) viewport.scrollLeft = 0;
    else if (viewport.scrollLeft > maxLeft) viewport.scrollLeft = maxLeft;
    if (viewport.scrollTop < 0) viewport.scrollTop = 0;
    else if (viewport.scrollTop > maxTop) viewport.scrollTop = maxTop;
  }

  // ========= Zoom interne (centré & doux) =========
  let zoom = 1;
  const ZOOM_MIN = 0.25, ZOOM_MAX = 4;
  const ZOOM_STEP = 1.12; // plus doux

  function clampZoom(z){ return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); }

  // Pas de clampScroll ici pour éviter le "saut" avant recalcule
  function applyZoom(){
    stageWrap.style.transform = `scale(${zoom})`;
    zLevelEl.textContent = `${Math.round(zoom*100)}%`;
    updateSizer(); // met à jour la zone scrollable réelle
  }

  // 👉 Zoom centré *réellement* sur le centre visible du viewport (math logique)
  function setZoomCentered(newZoom){
    const vp = viewport;
    // centre logique (coordonnées non-scalées) actuellement au centre de l'écran
    const logicalCX = (vp.scrollLeft + vp.clientWidth  / 2) / zoom;
    const logicalCY = (vp.scrollTop  + vp.clientHeight / 2) / zoom;

    zoom = clampZoom(newZoom);
    applyZoom(); // met à jour transform + sizer

    // repositionne le scroll pour garder le même centre logique
    vp.scrollLeft = logicalCX * zoom - vp.clientWidth  / 2;
    vp.scrollTop  = logicalCY * zoom - vp.clientHeight / 2;

    clampScroll(); // borne aux bords
  }

  // Boutons + / −
  function zoomIn(){  setZoomCentered(clampZoom(zoom * ZOOM_STEP)); }
  function zoomOut(){ setZoomCentered(clampZoom(zoom / ZOOM_STEP)); }
  document.getElementById('zIn').onclick    = zoomIn;
  document.getElementById('zOut').onclick   = zoomOut;
  document.getElementById('zReset').onclick = ()=>{ zoom = 1; applyZoom(); clampScroll(); };
  document.getElementById('dockZIn').onclick  = zoomIn;
  document.getElementById('dockZOut').onclick = zoomOut;

  // ====== Pinch-to-zoom (centré écran & adouci) ======
  const activePointers = new Map();
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  let pinchInProgress = false;

  function pointersDistance(){
    const arr = [...activePointers.values()];
    if (arr.length < 2) return 0;
    const dx = arr[0].x - arr[1].x;
    const dy = arr[0].y - arr[1].y;
    return Math.hypot(dx, dy);
  }
  function setTouchActionDuringPinch(on){
    viewport.style.touchAction = on ? 'none' : 'pan-x pan-y';
  }

  viewport.addEventListener('pointerdown', (e)=>{
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size === 2){
      pinchInProgress = true;
      pinchStartDist = pointersDistance();
      pinchStartZoom = zoom;
      setTouchActionDuringPinch(true);
      e.preventDefault();
    }
  }, { passive:false });

  viewport.addEventListener('pointermove', (e)=>{
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchInProgress && activePointers.size >= 2){
      const dist = pointersDistance();
      if (dist > 0 && pinchStartDist > 0){
        const factor = dist / pinchStartDist;
        const eased = Math.pow(factor, 0.85); // pinch moins “violent”
        const newZoom = clampZoom(pinchStartZoom * eased);
        setZoomCentered(newZoom);              // 👉 centré écran
        e.preventDefault();
      }
    }
  }, { passive:false });

  function endPointer(e){
    if (activePointers.has(e.pointerId)) activePointers.delete(e.pointerId);
    if (activePointers.size < 2 && pinchInProgress){
      pinchInProgress = false;
      setTouchActionDuringPinch(false);
      clampScroll();
    }
  }
  viewport.addEventListener('pointerup', endPointer,   { passive:true });
  viewport.addEventListener('pointercancel', endPointer,{ passive:true });
  viewport.addEventListener('pointerleave', endPointer, { passive:true });

  // === Coordonnées (x,y) avec zoom
  function screenToGrid(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const localX = (clientX - rect.left) / zoom;
    const localY = (clientY - rect.top)  / zoom;
    const x = Math.floor(localX / PIX);
    const y = Math.floor(localY / PIX);
    return { x, y };
  }
  canvas.addEventListener('mousemove', (e)=>{
    const {x,y} = screenToGrid(e.clientX, e.clientY);
    coordsEl.textContent = (x>=0 && x<W && y>=0 && y<H) ? `(${x}, ${y})` : '—';
  });

  // Storage helpers (PNG)
  function formatParisFilename(prefix="snapshot", ext="png"){
    const fmt = new Intl.DateTimeFormat('fr-FR',{ timeZone:'Europe/Paris', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const parts = fmt.formatToParts(new Date());
    const get=t=>parts.find(p=>p.type===t)?.value||'';
    const stamp = `${get('year')}-${get('month')}-${get('day')}_${get('hour')}-${get('minute')}-${get('second')}`;
    return `${prefix}_${stamp}.${ext}`;
  }
  function canvasToBlobPNG(cnv){ return new Promise(res => cnv.toBlob(b => res(b), 'image/png')); }
  async function uploadSnapshot(folder, filename){
    await new Promise(r => requestAnimationFrame(r));
    const blob = await canvasToBlobPNG(canvas);
    const path = `${folder}/${filename}`;
    const ref = storage.ref().child(path);
    await ref.put(blob, { contentType: 'image/png' });
    const url = await ref.getDownloadURL();
    console.log('Snapshot uploadé →', path, url);
    return { path, url };
  }

  // Reset & archive ——— PAUSE DU RESET ———
  const PERIOD_RESET=48*60*60*1000, PERIOD_ARCHIVE=60*1000;
  const nextResetRef=db.ref('config/nextResetAt'), lastResetRef=db.ref('config/lastResetAt');
  const nextArchRef=db.ref('config/nextArchiveAt'), lastArchRef=db.ref('config/lastArchiveAt');

  function updateCountdown(ts){ countdownEl.textContent = 'Pause'; }
  // nextResetRef.on('value', s => updateCountdown(s.val())); // en pause
  async function tryReset(){ return; }

  async function tryArchive(){
    const now=Date.now(); let commit=false, newNext=null;
    const res = await nextArchRef.transaction(cur => {
      if (cur===null){ newNext=now+PERIOD_ARCHIVE; commit=true; return newNext; }
      if (now>=cur){ newNext=now+PERIOD_ARCHIVE; commit=true; return newNext; }
      return;
    });
    if (res.committed && commit) {
      try {
        fullPixels(); if (showGridChk.checked) drawGridOverlay();
        await uploadSnapshot('archive', formatParisFilename('archive','png'));
        await lastArchRef.set(now);
      } catch(e) { console.warn('Archive échouée:', e); }
    }
  }

  // Présence + compteur clics
  const infoConnectedRef = db.ref('.info/connected');
  const presenceRootRef  = db.ref('presence');
  const clicksRef        = db.ref('stats/clicksTotal');

  auth.signInAnonymously().catch(console.error);
  auth.onAuthStateChanged(user => {
    if (!user) return;
    const uid = user.uid;

    const myPresenceRef = presenceRootRef.child(uid);
    infoConnectedRef.on('value', snap => {
      if (snap.val() === true) {
        myPresenceRef.onDisconnect().remove().catch(()=>{});
        myPresenceRef.set({ online: true, ts: firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
      }
    });

    let online = 0;
    presenceRootRef.once('value').then(s => {
      online = s.numChildren(); onlineEl.textContent = String(online); onlineEl.classList.remove('dim');
    });
    presenceRootRef.on('child_added',  ()=>{ online++;  onlineEl.textContent = String(online); });
    presenceRootRef.on('child_removed', ()=>{ online = Math.max(0, online-1); onlineEl.textContent = String(online); });

    clicksRef.on('value', s => { clickEl.textContent = String(s.val() || 0); clickEl.classList.remove('dim'); });

    const pixelsRef = db.ref('pixels');
    // Chargement progressif
    pixelsRef.once('value').then(snap => {
      const val = snap.val() || {};
      let i = 0; const keys = Object.keys(val);
      function chunk() {
        const t0 = performance.now();
        while (i < keys.length && performance.now() - t0 < 12) {
          const key = keys[i++]; const [x,y] = key.split('_').map(Number);
          const col = Number.isFinite(+val[key].color) ? +val[key].color : 1;
          if (x>=0 && x<W && y>=0 && y<H) grid[y][x] = col;
        }
        fullPixels(); if (showGridChk.checked) drawGridOverlay();
        if (i < keys.length) requestAnimationFrame(chunk);
      }
      requestAnimationFrame(chunk);
    });

    // Temps réel
    let overlayQueued = false;
    function queueOverlay(){
      if (!showGridChk.checked) return;
      if (overlayQueued) return;
      overlayQueued = true;
      requestAnimationFrame(()=>{ drawGridOverlay(); overlayQueued = false; });
    }
    pixelsRef.on('child_added', snap => {
      const [x,y] = snap.key split('_').map(Number);
      const col = Number.isFinite(+snap.val().color) ? +snap.val().color : 1;
      if (x>=0 && x<W && y>=0 && y<H) { grid[y][x] = col; drawCell(x,y); queueOverlay(); }
    });
    pixelsRef.on('child_changed', snap => {
      const [x,y] = snap.key.split('_').map(Number);
      const col = Number.isFinite(+snap.val().color) ? +snap.val().color : 1;
      if (x>=0 && x<W && y>=0 && y<H) { grid[y][x] = col; drawCell(x,y); queueOverlay(); }
    });

    // Pose de pixel (avec zoom) + incrément compteur
    let panActive = false; // géré par le bouton Main
    canvas.addEventListener('click', async (e)=>{
      if (panActive) return; // en mode Main, pas de pose
      const rect = canvas.getBoundingClientRect();
      const localX = (e.clientX - rect.left) / zoom;
      const localY = (e.clientY - rect.top)  / zoom;
      const x = Math.floor(localX / PIX);
      const y = Math.floor(localY / PIX);
      if (x<0||x>=W||y<0||y>=H) return;
      if (selected < 0 || selected >= colors.length) return;
      try {
        await db.ref(`pixels/${x}_${y}`).set({ color: selected });
        await clicksRef.transaction(cur => (cur||0) + 1);
      } catch (err) { console.error('write pixel / click count error', err); }
    });

    // Raccourci Shift + molette (desktop) = changer de couleur
    canvas.addEventListener('wheel', e => {
      if (e.shiftKey) {
        e.preventDefault();
        if (e.deltaY > 0) selected = (selected + 1) % colors.length;
        else if (e.deltaY < 0) selected = (selected - 1 + colors.length) % colors.length;
        [...paletteGrid.children].forEach((el, idx)=> el.classList.toggle('activeSw', idx===selected));
        updateCursor();
      }
    }, { passive: false });

    // Archives (actives)
    setInterval(tryArchive, 10*1000);

    // ========== Mode MAIN (pan/drag du viewport) ==========
    let isDragging = false;
    let startX = 0, startY = 0;
    let startScrollLeft = 0, startScrollTop = 0;

    function setPanActive(on){
      panActive = on;
      panToggle.classList.toggle('active', panActive);
      viewport.style.cursor = panActive ? 'grab' : 'default';
    }

    panToggle.addEventListener('click', ()=> setPanActive(!panActive) );

    viewport.addEventListener('pointerdown', (e)=>{
      if (!panActive) return;
      isDragging = true;
      viewport.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      startScrollLeft = viewport.scrollLeft;
      startScrollTop  = viewport.scrollTop;
      viewport.style.cursor = 'grabbing';
      e.preventDefault();
    });
    viewport.addEventListener('pointermove', (e)=>{
      if (!panActive || !isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      viewport.scrollLeft = startScrollLeft - dx;
      viewport.scrollTop  = startScrollTop  - dy;
      clampScroll();
      e.preventDefault();
    });
    function endPan(e){
      if (!isDragging) return;
      isDragging = false;
      try { viewport.releasePointerCapture(e.pointerId); } catch {}
      viewport.style.cursor = panActive ? 'grab' : 'default';
      clampScroll();
    }
    viewport.addEventListener('pointerup', endPan);
    viewport.addEventListener('pointercancel', endPan);
    viewport.addEventListener('pointerleave', endPan);
  });

  // Layout + sizer init
  function relayoutAll(){ layoutPaletteTwoRows(); layoutViewport(); updateSizer(); clampScroll(); }
  buildPalette(); updateCursor();

  // Recalcule quand la “visual viewport” change (Android : barre URL qui apparait/disparait, zoom UI, etc.)
  if (window.visualViewport){
    visualViewport.addEventListener('resize', layoutViewport);
    visualViewport.addEventListener('scroll',  layoutViewport);
  }

  window.addEventListener('load', ()=>{ relayoutAll(); applyZoom(); clampScroll(); });
  window.addEventListener('resize', ()=>{ relayoutAll(); });
  window.addEventListener('orientationchange', ()=>{ setTimeout(relayoutAll, 200); });

  // Recalage si la palette ou la barre du haut change de taille
  new ResizeObserver(()=>{ layoutViewport(); clampScroll(); }).observe(paletteBar);
  new ResizeObserver(()=>{ layoutViewport(); clampScroll(); }).observe(uiBar);

  // === Affichage compteur reset en PAUSE ===
  document.getElementById('countdown').textContent = 'Pause';
  </script>
</body>
</html>
