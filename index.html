<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel War — Illimité + Reset 48h</title>
<style>
body { font-family: system-ui, sans-serif; margin: 16px; }
#board { image-rendering: pixelated; border: 1px solid #333; touch-action: manipulation; }
.palette { display:flex; gap:8px; margin:12px 0; flex-wrap: wrap; }
.sw { width:24px; height:24px; border:1px solid #000; cursor:pointer; }
.ui { display:flex; gap:16px; align-items:center; margin-bottom:8px; flex-wrap: wrap; }
.dim { opacity: .7 }
</style>
</head>
<body>
<h1>Pixel War — Illimité</h1>
<div class="ui">
<div>Prochain reset : <span id="countdown" class="dim">chargement…</span></div>
</div>
<canvas id="board" width="1000" height="1000"></canvas>
<div class="palette" id="palette"></div>


<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>
// 1) Config Firebase
const firebaseConfig = {
apiKey: "PASTE_ME",
authDomain: "PASTE_ME",
databaseURL: "PASTE_ME",
projectId: "PASTE_ME",
storageBucket: "PASTE_ME",
messagingSenderId: "PASTE_ME",
appId: "PASTE_ME"
};


firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();


// 2) Paramètres mosaïque
const W = 100, H = 100, PIX = 10;
const colors = ['#000000','#FFFFFF','#E91E63','#9C27B0','#3F51B5','#03A9F4','#009688','#8BC34A','#FFEB3B','#FF9800'];
let selected = 2;


const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const paletteEl = document.getElementById('palette');
const countdownEl = document.getElementById('countdown');


// Palette
colors.forEach((c,i)=>{
const sw = document.createElement('div');
sw.className = 'sw'; sw.style.background = c; sw.title = c;
sw.onclick = ()=>{ selected = i; };
paletteEl.appendChild(sw);
});


// Buffer local + dessin
let grid = Array.from({length:H}, ()=>Array.from({length:W}, ()=>1));
function drawCell(x,y){ ctx.fillStyle = colors[grid[y][x]]; ctx.fillRect(x*PIX, y*PIX, PIX, PIX); }
function fullDraw(){ for (let y=0;y<H;y++) for (let x=0;x<W;x++) drawCell(x,y); }
fullDraw();

// 3) Auth anonyme
auth.signInAnonymously().catch(console.error);
auth.onAuthStateChanged(async user => {
if (!user) return;
const pixelsRef = db.ref('pixels');


// 3a) Charger et écouter les pixels
pixelsRef.once('value').then(snap => {
const val = snap.val() || {};
for (const key in val) {
const [x,y] = key.split('_').map(Number);
const color = Number(val[key].color) || 1;
grid[y][x] = color;
}
fullDraw();
});
pixelsRef.on('child_added', snap => {
const [x,y] = snap.key.split('_').map(Number);
const color = Number(snap.val().color) || 1;
grid[y][x] = color; drawCell(x,y);
});
pixelsRef.on('child_changed', snap => {
const [x,y] = snap.key.split('_').map(Number);
const color = Number(snap.val().color) || 1;
grid[y][x] = color; drawCell(x,y);
});

// 3b) Clic = poser pixel (illimité, pas de crédits)
canvas.addEventListener('click', async (e)=>{
const rect = canvas.getBoundingClientRect();
const x = Math.floor((e.clientX - rect.left)/PIX);
const y = Math.floor((e.clientY - rect.top)/PIX);
if (x<0||x>=W||y<0||y>=H) return;
try {
await db.ref(`pixels/${x}_${y}`).set({ color: selected });
} catch (err) { console.error('write pixel error', err); }
});


// 4) Reset automatique toutes les 48h
const PERIOD = 48*60*60*1000; // 48 heures en ms
const nextRef = db.ref('config/nextResetAt');
const lastRef = db.ref('config/lastResetAt');


// Afficher un compte à rebours
function updateCountdown(ts){
if (!ts) { countdownEl.textContent = '—'; return; }
const left = ts - Date.now();
if (left <= 0) { countdownEl.textContent = 'reset en cours…'; return; }
const h = Math.floor(left/3_600_000);
const m = Math.floor((left%3_600_000)/60_000);
const s = Math.floor((left%60_000)/1000);
countdownEl.textContent = `${h}h ${m}m ${s}s`;
}


nextRef.on('value', s => updateCountdown(s.val()));


// Tente un reset si l'heure est passée : on utilise une transaction pour qu'un seul client gagne la course
async function tryReset(){
const now = Date.now();
let commit = false; let newNext = null;
const res = await nextRef.transaction(cur => {
if (cur === null) { // première initialisation
newNext = now + PERIOD; commit = true; return newNext;
}
if (now >= cur) { // échéance atteinte → programme le prochain
newNext = now + PERIOD; commit = true; return newNext;
}
return; // pas de changement
});
if (res.committed && commit) {
// On est le gagnant : efface la grille puis note l'heure de reset
await db.ref('pixels').remove();
await lastRef.set(now);
// redessine localement
grid = Array.from({length:H}, ()=>Array.from({length:W}, ()=>1));
fullDraw();
}
}


// Au démarrage puis toutes les 60s, on vérifie
tryReset();
setInterval(tryReset, 60*1000);
// bonus : mettre à jour le compte à rebours chaque seconde
setInterval(async ()=>{
const snap = await nextRef.get();
updateCountdown(snap.val());
}, 1000);
});
</script>
</body>
</html>
